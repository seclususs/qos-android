; ==============================================================================
; Configuration
; ==============================================================================

; ------------------------------------------------------------------------------
; [Blocker Controller]
; ------------------------------------------------------------------------------
; Enforces the disabled state of targeted background components
; (such as specific GMS analytics and ad services) to reduce
; unnecessary resource consumption and wakeups.
;
blocker_enabled=true

; ------------------------------------------------------------------------------
; [Cleaner Controller]
; ------------------------------------------------------------------------------
; Performs opportunistic background cleanup of cache and stale data
; based on system load, thermal conditions, and storage pressure.
; Designed to minimize impact on active applications and foreground tasks.
;
cleaner_enabled=true

; ------------------------------------------------------------------------------
; [CPU Controller]
; ------------------------------------------------------------------------------
; Dynamically manages kernel scheduler parameters (EAS/HMP) based on
; system load pressure (Pressure Stall Information - CPU).
;
cpu_enabled=true

; ------------------------------------------------------------------------------
; [Storage Controller]
; ------------------------------------------------------------------------------
; Tunes block device I/O queues to maximize data throughput
; and reduce disk access latency during I/O congestion.
;
storage_enabled=true

; ------------------------------------------------------------------------------
; [System Tweaks]
; ------------------------------------------------------------------------------
; Applies a curated set of static kernel (sysctl) configurations and system
; properties to improve network and kernel stability.
;
tweaks_enabled=true

; ==============================================================================
; Advanced Tuning
; ==============================================================================
; WARNING: The following parameters override the safe defaults baked into the
; core. Modify these only if you understand kernel scheduling and block I/O.
; 
; To fall back to the safe defaults, simply comment out the lines below 
; using a semicolon (;).
; ==============================================================================

; ------------------------------------------------------------------------------
; [CPU Kernel Limits]
; ------------------------------------------------------------------------------
min_latency_ns=
max_latency_ns=
min_granularity_ns=
max_granularity_ns=
min_wakeup_ns=
max_wakeup_ns=
min_migration_cost=
max_migration_cost=
min_walt_init_pct=
max_walt_init_pct=
min_uclamp_min=
max_uclamp_min=

; ------------------------------------------------------------------------------
; [Storage Kernel Limits]
; ------------------------------------------------------------------------------
min_read_ahead=
max_read_ahead=
min_nr_requests=
max_nr_requests=
